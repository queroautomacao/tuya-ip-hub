[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuya-ip-hub"
dynamic = ["version"]
description = "Bridge between the Tuya platform and IP equipment on the local network (ponte entre a plataforma Tuya e equipamentos IP na rede local)"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["aiohttp>=3.12,<4"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-aiohttp>=1.1", "ruff>=0.14", "pip-licenses>=5"]

[project.urls]
Repository = "https://github.com/queroautomacao/tuya-ip-hub"

[tool.setuptools.dynamic]
version = {attr = "iphub.versao.VERSAO"}

[tool.setuptools.packages.find]
include = ["iphub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Why: the test layers repeat file names (api/test_x.py and seguranca/test_x.py), which the
# default import mode cannot collect.
# Por que: as camadas de teste repetem nome de arquivo (api/test_x.py e seguranca/test_x.py),
# que o modo de importação padrão não consegue coletar.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
